name: DeskForce Linux Flutter (.deb amd64)

# Branded amd64 .deb from RustDesk upstream + oem/apply_branding.py (not RDGen).
on:
  workflow_dispatch:

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  OEM_APP_NAME: DeskForce
  OEM_APP_VERSION: "1.2.0"
  OEM_ID_SERVER: "78.29.49.98"
  OEM_RELAY_SERVER: "78.29.49.98"
  OEM_API_SERVER: "https://deskforce.dr6ter.ru"
  OEM_KEY_PUB: "ERushCbh73QS5YNPuOvqK5M3Yx9v9z+8Ft5O+iAQevg="
  RUSTDESK_TAG: "1.4.6"

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /opt/ghc /usr/local/lib/android /usr/share/dotnet || true
          sudo apt-get update -y
          df -h

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout DeskForce (OEM branding)
        uses: actions/checkout@v4
        with:
          path: deskforce

      - name: Clone RustDesk ${{ env.RUSTDESK_TAG }}
        run: |
          git clone --depth 1 --branch "${{ env.RUSTDESK_TAG }}" \
            https://github.com/rustdesk/rustdesk.git rustdesk
          cd rustdesk
          git submodule update --init --recursive --depth 1 || git submodule update --init --recursive

      - name: Apply DeskForce branding
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          export RUSTDESK_SRC="$GITHUB_WORKSPACE/rustdesk"
          export OEM_APP_NAME OEM_APP_VERSION OEM_ID_SERVER OEM_RELAY_SERVER OEM_API_SERVER OEM_KEY_PUB
          python3 deskforce/oem/apply_branding.py
          test -f rustdesk/flutter/assets/icon.png || cp -f deskforce/oem/branding/app_icon.png rustdesk/flutter/assets/icon.png
          grep -q "DeskForce" rustdesk/libs/hbb_common/src/config.rs
          grep -q "78.29.49.98" rustdesk/libs/hbb_common/src/config.rs
          ! grep -q "rs-ny.rustdesk.com" rustdesk/libs/hbb_common/src/config.rs
          grep -q 'version = "1.2.0"' rustdesk/Cargo.toml
          grep -q "Name=DeskForce" rustdesk/res/rustdesk.desktop
          grep -q "2DD4BF" rustdesk/flutter/lib/common.dart
          # Prefer DeskForce icons in deb package
          cp -f deskforce/oem/branding/app_icon.png rustdesk/res/128x128@2x.png || true
          cp -f deskforce/oem/branding/app_icon.svg rustdesk/res/scalable.svg || true

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential clang cmake curl gcc git g++ \
            libayatana-appindicator3-dev libasound2-dev libclang-dev \
            libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev libpam0g-dev libpulse-dev libva-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxdo-dev libxfixes-dev llvm-dev nasm ninja-build \
            pkg-config python3 rpm unzip wget xz-utils libssl-dev \
            dpkg-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustdesk -> target
          prefix-key: deskforce-linux-amd64

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        working-directory: rustdesk
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-linux --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do
              echo "==== $f ===="; head -n 80 "$f" || true
            done
            exit 1
          fi

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Patch Flutter + enable Linux desktop
        run: |
          FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          cp deskforce/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_ROOT/"
          cd "$FLUTTER_ROOT"
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff || true
          flutter config --enable-linux-desktop
          flutter doctor -v

      - name: Install flutter_rust_bridge
        run: |
          cargo install cargo-expand --locked || true
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid" --locked \
            || cargo install flutter_rust_bridge_codegen --features "uuid" --locked

      - name: Generate FFI bridge
        working-directory: rustdesk
        run: |
          # only build cdylib (match upstream linux CI)
          sed -i 's/\["cdylib", "staticlib", "rlib"\]/["cdylib"]/g' Cargo.toml
          pushd flutter
          flutter pub get
          popd
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          mkdir -p flutter/linux/flutter/ephemeral flutter/ios/Runner
          cp -f flutter/macos/Runner/bridge_generated.h flutter/ios/Runner/bridge_generated.h || true
          test -f flutter/lib/generated_bridge.dart
          test -f src/bridge_generated.rs

      - name: Build DeskForce Linux + .deb
        working-directory: rustdesk
        env:
          DEB_ARCH: amd64
        run: |
          set -e
          cargo build --lib --features hwcodec,flutter,unix-file-copy-paste --release
          # build.py --flutter --skip-cargo packages deb from flutter linux bundle
          python3 ./build.py --flutter --hwcodec --unix-file-copy-paste --skip-cargo
          ls -lh rustdesk*.deb || ls -lh *.deb || true
          DEB=$(ls -1 rustdesk-*.deb 2>/dev/null | head -n1 || true)
          if [[ -z "$DEB" ]]; then
            DEB=$(ls -1 *.deb 2>/dev/null | head -n1 || true)
          fi
          test -n "$DEB" && test -f "$DEB"
          mkdir -p ../out
          cp -f "$DEB" ../out/deskforce_1.2.0_amd64.deb
          cp -f "$DEB" ../out/DeskForce.deb
          ls -lh ../out/
          SIZE=$(wc -c < ../out/DeskForce.deb)
          echo "DeskForce.deb bytes=$SIZE"
          test "$SIZE" -gt 5000000
          # Sanity: package metadata mentions DeskForce where we patched desktop
          dpkg-deb -I ../out/DeskForce.deb | head -40 || true
          dpkg-deb -c ../out/DeskForce.deb | rg -i 'desktop|rustdesk$' | head -30 || true

      - uses: actions/upload-artifact@v4
        with:
          name: DeskForce-Linux-amd64
          path: |
            out/DeskForce.deb
            out/deskforce_1.2.0_amd64.deb
          if-no-files-found: error

name: DeskForce Android Flutter (paper/brass)

# Branded arm64 APK from RustDesk upstream + oem/apply_branding.py (not RDGen).
on:
  workflow_dispatch:

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  CARGO_NDK_VERSION: "3.1.2"
  NDK_VERSION: "r27c"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  OEM_APP_NAME: DeskForce
  OEM_APP_VERSION: "1.1.2"
  OEM_ID_SERVER: "78.29.49.98"
  OEM_RELAY_SERVER: "78.29.49.98"
  OEM_API_SERVER: "https://deskforce.dr6ter.ru"
  OEM_KEY_PUB: "ERushCbh73QS5YNPuOvqK5M3Yx9v9z+8Ft5O+iAQevg="
  RUSTDESK_TAG: "1.4.6"

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout DeskForce (OEM branding)
        uses: actions/checkout@v4
        with:
          path: deskforce

      - name: Clone RustDesk ${{ env.RUSTDESK_TAG }}
        run: |
          git clone --depth 1 --branch "${{ env.RUSTDESK_TAG }}" \
            https://github.com/rustdesk/rustdesk.git rustdesk
          cd rustdesk
          git submodule update --init --recursive --depth 1 || git submodule update --init --recursive

      - name: Apply DeskForce branding
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil
          export RUSTDESK_SRC="$GITHUB_WORKSPACE/rustdesk"
          export OEM_APP_NAME OEM_APP_VERSION OEM_ID_SERVER OEM_RELAY_SERVER OEM_API_SERVER OEM_KEY_PUB
          python3 deskforce/oem/apply_branding.py
          test -f rustdesk/flutter/assets/icon.png || cp -f deskforce/oem/branding/app_icon.png rustdesk/flutter/assets/icon.png
          grep -q "DeskForce" rustdesk/libs/hbb_common/src/config.rs
          grep -q "78.29.49.98" rustdesk/libs/hbb_common/src/config.rs
          ! grep -q "rs-ny.rustdesk.com" rustdesk/libs/hbb_common/src/config.rs
          grep -q 'version = "1.1.2"' rustdesk/Cargo.toml
          grep -q "DeskForce" rustdesk/flutter/android/app/src/main/res/values/strings.xml
          grep -q 'android:label="DeskForce"' rustdesk/flutter/android/app/src/main/AndroidManifest.xml
          grep -q 'applicationId "ru.deskforce.ud"' rustdesk/flutter/android/app/build.gradle
          # Paper/brass theme must be in Flutter sources (not stock Colors.blue primary)
          grep -q 'Color(0xFFB8892A)' rustdesk/flutter/lib/common.dart
          grep -q 'Color(0xFFF3EFE6)' rustdesk/flutter/lib/common.dart
          grep -q 'Color(0xFF12161C)' rustdesk/flutter/lib/common.dart
          ! grep -q 'primary: Colors.blue' rustdesk/flutter/lib/common.dart
          grep -q 'DeskForce: never stock RustDesk update check' rustdesk/flutter/lib/common.dart
          # All adaptive launcher densities must be DeskForce D-mark (not stock P)
          python3 - <<'PY'
          import hashlib, pathlib
          brand = pathlib.Path("deskforce/oem/branding/adaptive_icon.png").read_bytes()
          # Compare via decoded pixels of resized master — file bytes differ per size
          from PIL import Image
          import io
          master = Image.open(io.BytesIO(brand)).convert("RGBA")
          res = pathlib.Path("rustdesk/flutter/android/app/src/main/res")
          checked = 0
          for folder, size in {
              "mipmap-mdpi": 108,
              "mipmap-hdpi": 162,
              "mipmap-xhdpi": 216,
              "mipmap-xxhdpi": 324,
              "mipmap-xxxhdpi": 432,
          }.items():
              p = res / folder / "ic_launcher_foreground.png"
              assert p.is_file(), p
              got = Image.open(p).convert("RGBA")
              assert got.size == (size, size), (p, got.size)
              # Sample center pixel — brass D mark, not stock blue/cyan
              cx, cy = size // 2, size // 2
              r, g, b, a = got.getpixel((cx, cy))
              # DeskForce D: either brass or ink / transparent near hollow; reject vivid blue
              assert not (b > 180 and r < 80), f"stock-blue-ish pixel at {p}: {(r,g,b,a)}"
              checked += 1
          print(f"Android mipmap foregrounds OK ({checked} densities)")
          bg = (res / "values" / "ic_launcher_background.xml").read_text()
          assert "#f3efe6" in bg.lower()
          assert (res / "mipmap-xxxhdpi" / "ic_launcher.png").is_file()
          # Flutter asset icon must match branding master hash
          asset = pathlib.Path("rustdesk/flutter/assets/icon.png").read_bytes()
          assert hashlib.md5(asset).hexdigest() == hashlib.md5(brand).hexdigest()
          print("Flutter assets/icon.png matches branding")
          PY
          test -f rustdesk/flutter/lib/mobile/pages/connection_page.dart
          grep -q 'deskforce_update.dart' rustdesk/flutter/lib/mobile/pages/connection_page.dart
          ! grep -q 'rustdesk.com/download' rustdesk/flutter/lib/mobile/pages/connection_page.dart
          ! grep -q 'Colors.pinkAccent' rustdesk/flutter/lib/mobile/pages/connection_page.dart

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc git g++ \
            gcc-multilib g++-multilib libc6-dev \
            libclang-dev libgtk-3-dev llvm-dev nasm ninja-build \
            openjdk-17-jdk-headless pkg-config wget unzip

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Patch Flutter dropdown (3.24.5)
        run: |
          FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          cp deskforce/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_ROOT/"
          cd "$FLUTTER_ROOT"
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff || true

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install Android vcpkg deps (arm64-v8a)
        working-directory: rustdesk
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./flutter/build_android_deps.sh arm64-v8a

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustdesk -> target
          prefix-key: deskforce-android-arm64

      - name: Install flutter_rust_bridge + cargo-ndk
        run: |
          cargo install cargo-expand --locked || true
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid" --locked \
            || cargo install flutter_rust_bridge_codegen --features "uuid" --locked
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked

      - name: Generate FFI bridge
        working-directory: rustdesk
        run: |
          rustup component add rustfmt || true
          pushd flutter
          flutter pub get
          popd
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          mkdir -p flutter/ios/Runner flutter/android/app/src/main
          cp -f flutter/macos/Runner/bridge_generated.h flutter/ios/Runner/bridge_generated.h || true
          test -f flutter/lib/generated_bridge.dart
          test -f src/bridge_generated.rs

      - name: Build librustdesk (arm64)
        working-directory: rustdesk
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add aarch64-linux-android
          ./flutter/ndk_arm64.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so \
            ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
            ./flutter/android/app/src/main/jniLibs/arm64-v8a/

      - name: Build DeskForce APK (arm64)
        working-directory: rustdesk
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties || true
          # Sideload: use debug signing (no Play Store key in this OEM pipeline)
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          pushd flutter
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          popd
          mkdir -p ../out
          APK=$(ls flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk)
          test -f "$APK"
          cp -f "$APK" ../out/DeskForce.apk
          # Also keep arch-tagged name for CI debugging
          cp -f "$APK" ../out/DeskForce-1.2.0-beta.7-aarch64.apk
          ls -lh ../out/
          SIZE=$(wc -c < ../out/DeskForce.apk)
          echo "DeskForce.apk bytes=$SIZE"
          test "$SIZE" -gt 10000000
          # Post-build APK checks: label + non-stock icon asset
          sudo apt-get install -y -qq aapt unzip >/dev/null || true
          if command -v aapt >/dev/null; then
            aapt dump badging ../out/DeskForce.apk | tee ../out/badging.txt
            grep -E "application-label:'DeskForce'|application: .*label='DeskForce'" ../out/badging.txt
            grep -E "name='ru.deskforce.ud'|name='com.carriez.flutter_hbb'" ../out/badging.txt
            grep -q "versionName='1.2.0-beta.7'" ../out/badging.txt
          fi
          unzip -p ../out/DeskForce.apk assets/flutter_assets/assets/icon.png > ../out/apk-icon.png
          python3 - <<'PY'
          import hashlib, pathlib
          brand = pathlib.Path("../deskforce/oem/branding/app_icon.png").read_bytes()
          apk_icon = pathlib.Path("../out/apk-icon.png").read_bytes()
          bh, ah = hashlib.md5(brand).hexdigest(), hashlib.md5(apk_icon).hexdigest()
          if ah != bh:
              print(f"WARN: APK icon hash {ah} != brand {bh} (continuing)")
          else:
              print("APK flutter icon matches DeskForce branding")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: DeskForce-Android-arm64
          path: |
            out/DeskForce.apk
            out/DeskForce-1.2.0-beta.7-aarch64.apk
            out/badging.txt
          if-no-files-found: error
